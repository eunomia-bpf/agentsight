name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  actions: write
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: clippy

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libelf1 libelf-dev zlib1g-dev libclang-dev \
          make git clang llvm pkg-config build-essential

    - name: Build BPF C programs
      run: |
        cd bpf
        make

    - name: Run C unit tests
      run: |
        cd bpf
        make test

    - name: Build frontend
      run: |
        cd frontend
        npm install
        node scripts/prepare-sample.mjs
        npm run build

    - name: Setup control-plane Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Test control plane
      run: |
        cd control-plane
        npm ci
        npm test
        npm run check
        npx wrangler deploy --dry-run

    - name: Restore repository Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Build agentvis runtime
      run: |
        cd agentvis/web
        npm ci
        npm run build
        cmp dist/repository-nebula.iife.js ../vendor/vis/repository-nebula.iife.js

    - name: Validate npm package
      run: |
        node script/npm/sync-version.mjs
        node script/npm/prepare-agentsight.mjs
        cd package/npm/agentsight
        npm test
        npm pack --dry-run

    - name: Build Rust collector
      run: |
        cd collector
        cargo build --verbose

    - name: Check standalone agentsight-capture
      run: |
        cargo clippy --manifest-path agentsight-capture/Cargo.toml --all-targets -- -D warnings
        cargo test --manifest-path agentsight-capture/Cargo.toml --verbose
        cargo package --manifest-path agentsight-capture/Cargo.toml

    - name: Check standalone agentvis
      run: |
        cargo clippy --manifest-path agentvis/Cargo.toml --all-targets -- -D warnings
        cargo test --manifest-path agentvis/Cargo.toml --verbose

    - name: E2E latest agent CLI canary
      run: script/e2e/latest_agent_cli_canary.sh
      env:
        AGENTSIGHT_AGENT_CANARY_REQUIRE_EBPF: "1"

    - name: Run clippy (deny warnings)
      run: |
        cd collector
        cargo clippy --all-targets -- -D warnings

    - name: Run Rust tests
      run: |
        cd collector
        cargo test --verbose

    - name: Build agentpprof
      run: |
        cargo build --manifest-path agentpprof/Cargo.toml --verbose

    - name: Run agentpprof clippy (deny warnings)
      run: |
        cargo clippy --manifest-path agentpprof/Cargo.toml --all-targets -- -D warnings

    - name: Run agentpprof tests
      run: |
        cargo test --manifest-path agentpprof/Cargo.toml --verbose

    # Rebuild the C unit tests under AddressSanitizer and run them. Done last and
    # after `make clean` so the ASan objects don't replace the BPF binaries that
    # the Rust collector build embeds above.
    - name: Run C unit tests with AddressSanitizer
      run: |
        cd bpf
        make clean
        make ASAN=1 test

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [release_binaries, publish_crates]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download architecture-specific binaries
      uses: actions/download-artifact@v4
      with:
        pattern: docker-linux-*
        path: docker-bin

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Github Packages
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build image and push to GitHub Container Registry
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        context: ./
        file: script/Dockerfile.release
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
        push: true

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}

  release_prepare:
    name: Prepare Release Snapshot
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      tag: ${{ steps.set_version.outputs.tag }}
      publish_sha: ${{ steps.commit_release.outputs.publish_sha }}
      agent_session_version: ${{ steps.set_version.outputs.agent_session_version }}
      agentsight_capture_version: ${{ steps.set_version.outputs.agentsight_capture_version }}
      agentvis_version: ${{ steps.set_version.outputs.agentvis_version }}
      agentpprof_version: ${{ steps.set_version.outputs.agentpprof_version }}
    # Only run on push to master, not on PRs
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Set release version
      id: set_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        CRATES_IO_USER_AGENT="agentsight-release-ci (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}; run ${GITHUB_RUN_ID})"
        crates_io_version_exists() {
          local crate="$1"
          local version="$2"
          local status
          status="$(curl --retry 3 --retry-delay 2 -A "$CRATES_IO_USER_AGENT" -sS -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/${crate}/${version}" || true)"
          case "$status" in
            200) return 0 ;;
            404) return 1 ;;
            *)
              echo "::error::crates.io returned HTTP ${status} for ${crate} ${version}."
              exit 1
              ;;
          esac
        }

        BASE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' collector/Cargo.toml | head -1)"
        IFS=. read -r MAJOR MINOR PATCH <<EOF
        $BASE_VERSION
        EOF

        VERSION="$BASE_VERSION"
        while true; do
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::GitHub release ${TAG} already exists; trying next patch version."
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::Git tag ${TAG} already exists; trying next patch version."
          elif crates_io_version_exists "agentsight" "$VERSION"; then
            echo "::notice::crates.io agentsight ${VERSION} already exists; trying next patch version."
          elif crates_io_version_exists "agentsight-capture" "$VERSION"; then
            echo "::notice::crates.io agentsight-capture ${VERSION} already exists; trying next patch version."
          elif crates_io_version_exists "agentpprof" "$VERSION"; then
            echo "::notice::crates.io agentpprof ${VERSION} already exists; trying next patch version."
          elif crates_io_version_exists "agentvis" "$VERSION"; then
            echo "::notice::crates.io agentvis ${VERSION} already exists; trying next patch version."
          else
            break
          fi
          PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
        done

        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" collector/Cargo.toml
        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" agentsight-capture/Cargo.toml
        AGENT_SESSION_BASE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' agent-session/Cargo.toml | head -1)"
        IFS=. read -r AGENT_SESSION_MAJOR AGENT_SESSION_MINOR AGENT_SESSION_PATCH <<EOF
        $AGENT_SESSION_BASE_VERSION
        EOF

        AGENT_SESSION_VERSION="$AGENT_SESSION_BASE_VERSION"
        while crates_io_version_exists "agent-session" "$AGENT_SESSION_VERSION"; do
          echo "::notice::crates.io agent-session ${AGENT_SESSION_VERSION} already exists; trying next patch version."
          AGENT_SESSION_PATCH=$((AGENT_SESSION_PATCH + 1))
          AGENT_SESSION_VERSION="${AGENT_SESSION_MAJOR}.${AGENT_SESSION_MINOR}.${AGENT_SESSION_PATCH}"
        done

        sed -i "s/^version = \".*\"/version = \"$AGENT_SESSION_VERSION\"/" agent-session/Cargo.toml
        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" agentvis/Cargo.toml
        sed -i "s/agent-session = { version = \"[^\"]*\", path = \"..\\/agent-session\" }/agent-session = { version = \"$AGENT_SESSION_VERSION\", path = \"..\\/agent-session\" }/" agentvis/Cargo.toml
        sed -i "s/agent-session = { version = \"[^\"]*\", path = \"..\\/agent-session\" }/agent-session = { version = \"$AGENT_SESSION_VERSION\", path = \"..\\/agent-session\" }/" agentsight-capture/Cargo.toml
        sed -i "s/agentsight-capture = { version = \"[^\"]*\", path = \"..\\/agentsight-capture\"/agentsight-capture = { version = \"$VERSION\", path = \"..\\/agentsight-capture\"/" collector/Cargo.toml
        sed -i "s/agentvis = { version = \"[^\"]*\", path = \"..\\/agentvis\" }/agentvis = { version = \"$VERSION\", path = \"..\\/agentvis\" }/" collector/Cargo.toml
        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" agentpprof/Cargo.toml
        sed -i "s/agent-session = { version = \"[^\"]*\", path = \"..\\/agent-session\" }/agent-session = { version = \"$AGENT_SESSION_VERSION\", path = \"..\\/agent-session\" }/" agentpprof/Cargo.toml
        cargo generate-lockfile --manifest-path agent-session/Cargo.toml
        cargo generate-lockfile --manifest-path agentsight-capture/Cargo.toml
        cargo generate-lockfile --manifest-path agentvis/Cargo.toml
        cd collector
        cargo generate-lockfile
        cd ..
        cargo generate-lockfile --manifest-path agentpprof/Cargo.toml

        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
        echo "agent_session_version=${AGENT_SESSION_VERSION}" >> "$GITHUB_OUTPUT"
        echo "agentsight_capture_version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "agentvis_version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "agentpprof_version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "Using release version v${VERSION}"
        echo "Using agent-session version ${AGENT_SESSION_VERSION}"
        echo "Using agentsight-capture version ${VERSION}"
        echo "Using agentvis version ${VERSION}"
        echo "Using agentpprof version ${VERSION}"

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libelf1 libelf-dev zlib1g-dev libclang-dev \
          make git clang llvm pkg-config build-essential

    - name: Build package
      run: |
        make build
        cargo build --release --manifest-path agentpprof/Cargo.toml

    - name: Commit release snapshot
      id: commit_release
      env:
        VERSION: ${{ steps.set_version.outputs.version }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # build.rs vendors generated BPF assets into agentsight-capture/vendor
        # and frontend assets into collector/vendor.
        # Commit the full release snapshot before tagging or publishing so the
        # GitHub release, crates.io package, and master source agree.
        git add agent-session/Cargo.toml agent-session/Cargo.lock agentsight-capture/Cargo.toml agentsight-capture/Cargo.lock agentsight-capture/vendor agentvis/Cargo.toml agentvis/Cargo.lock agentvis/vendor collector/Cargo.toml collector/Cargo.lock collector/vendor agentpprof/Cargo.toml agentpprof/Cargo.lock
        if git diff --cached --quiet; then
          echo "Release snapshot already matches ${VERSION}; no commit needed."
        else
          git commit -m "chore: release agentsight ${VERSION} [skip ci]"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
        fi

        if [ -n "$(git status --porcelain --untracked-files=all -- agent-session agentsight-capture agentvis collector agentpprof)" ]; then
          echo "::error::release snapshot has uncommitted files after commit."
          git status --short --untracked-files=all -- agent-session agentsight-capture agentvis collector agentpprof
          exit 1
        fi

        PUBLISH_SHA="$(git rev-parse HEAD)"
        echo "publish_sha=${PUBLISH_SHA}" >> "$GITHUB_OUTPUT"
        echo "Release source commit: ${PUBLISH_SHA}"

    - name: Verify Cargo package version
      run: |
        VERSION="${{ steps.set_version.outputs.version }}"
        VERSION_NO_V="${VERSION#v}"
        echo "Using Cargo package version: $VERSION_NO_V"
        grep "^version" collector/Cargo.toml
        grep -q "^version = \"$VERSION_NO_V\"" collector/Cargo.toml
        grep -q "^version = \"$VERSION_NO_V\"" agentsight-capture/Cargo.toml
        grep -q "^version = \"${{ steps.set_version.outputs.agent_session_version }}\"" agent-session/Cargo.toml
        grep -q "^version = \"$VERSION_NO_V\"" agentvis/Cargo.toml
        grep -q "agent-session = { version = \"${{ steps.set_version.outputs.agent_session_version }}\", path = \"../agent-session\" }" agentvis/Cargo.toml
        grep -q "agent-session = { version = \"${{ steps.set_version.outputs.agent_session_version }}\", path = \"../agent-session\" }" agentsight-capture/Cargo.toml
        grep -q "agentsight-capture = { version = \"$VERSION_NO_V\", path = \"../agentsight-capture\" }" collector/Cargo.toml
        grep -q "agentvis = { version = \"$VERSION_NO_V\", path = \"../agentvis\" }" collector/Cargo.toml
        grep -q "^version = \"$VERSION_NO_V\"" agentpprof/Cargo.toml
        grep -q "agent-session = { version = \"${{ steps.set_version.outputs.agent_session_version }}\", path = \"../agent-session\" }" agentpprof/Cargo.toml

    - name: Smoke test local release binary
      run: |
        set -euo pipefail
        collector/target/release/agentsight --version
        collector/target/release/agentsight --help | tee /tmp/agentsight-local-help.txt

        for cmd in top monitor record report debug; do
          if ! grep -Eq "^[[:space:]]+$cmd[[:space:]]" /tmp/agentsight-local-help.txt; then
            echo "::error::local release binary is missing '$cmd' in agentsight --help"
            exit 1
          fi
        done

        agentvis/target/release/agentvis --version
        agentvis/target/release/agentvis --help | grep -F -- "--output"

        agentpprof/target/release/agentpprof --version
        agentpprof/target/release/agentpprof --help | tee /tmp/agentpprof-local-help.txt

        for flag in "--output" "--view" "--tagger" "--session-file"; do
          if ! grep -Fq -- "$flag" /tmp/agentpprof-local-help.txt; then
            echo "::error::local release binary is missing '$flag' in agentpprof --help"
            exit 1
          fi
        done

  publish_crates:
    name: Publish Cargo Packages
    needs: [release_prepare, release_binaries]
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout validated release snapshot
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.release_prepare.outputs.publish_sha }}
        submodules: 'recursive'

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libelf1 libelf-dev zlib1g-dev libclang-dev \
          make git clang llvm pkg-config build-essential

    - name: Verify agent-session Cargo package
      run: |
        CARGO_TARGET_DIR=/tmp/agentsight-agent-session-package \
          cargo package --manifest-path agent-session/Cargo.toml

    - name: Publish agent-session crate to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        set -euo pipefail
        CRATES_IO_USER_AGENT="agentsight-release-ci (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}; run ${GITHUB_RUN_ID})"
        crates_io_version_exists() {
          local crate="$1"
          local version="$2"
          local status
          status="$(curl --retry 3 --retry-delay 2 -A "$CRATES_IO_USER_AGENT" -sS -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/${crate}/${version}" || true)"
          case "$status" in
            200) return 0 ;;
            404) return 1 ;;
            *)
              echo "::error::crates.io returned HTTP ${status} for ${crate} ${version}."
              exit 1
              ;;
          esac
        }

        if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
          echo "::error::CARGO_REGISTRY_TOKEN is not set; cannot publish to crates.io."
          exit 1
        fi

        VERSION="${{ needs.release_prepare.outputs.agent_session_version }}"
        if crates_io_version_exists "agent-session" "$VERSION"; then
          echo "agent-session ${VERSION} already exists on crates.io; skipping publish."
        else
          cargo publish --manifest-path agent-session/Cargo.toml
        fi

        for attempt in 1 2 3 4 5 6; do
          if crates_io_version_exists "agent-session" "$VERSION"; then
            exit 0
          fi
          sleep $((attempt * 10))
        done
        echo "::error::agent-session ${VERSION} was not visible on crates.io after publish."
        exit 1

    - name: Verify agentvis Cargo package
      run: |
        CARGO_TARGET_DIR=/tmp/agentsight-agentvis-package \
          cargo package --manifest-path agentvis/Cargo.toml

    - name: Publish agentvis crate to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        set -euo pipefail
        CRATES_IO_USER_AGENT="agentsight-release-ci (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}; run ${GITHUB_RUN_ID})"
        if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
          echo "::error::CARGO_REGISTRY_TOKEN is not set; cannot publish to crates.io."
          exit 1
        fi

        VERSION="${{ needs.release_prepare.outputs.agentvis_version }}"
        cargo publish --manifest-path agentvis/Cargo.toml
        for attempt in 1 2 3 4 5 6; do
          if curl --retry 3 --retry-delay 2 -A "$CRATES_IO_USER_AGENT" -fsS \
            "https://crates.io/api/v1/crates/agentvis/${VERSION}" >/dev/null; then
            exit 0
          fi
          sleep $((attempt * 10))
        done
        echo "::error::agentvis ${VERSION} was not visible on crates.io after publish."
        exit 1

    - name: Verify agentsight-capture Cargo package
      run: |
        CARGO_TARGET_DIR=/tmp/agentsight-capture-package \
          cargo package --manifest-path agentsight-capture/Cargo.toml

    - name: Publish agentsight-capture crate to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        set -euo pipefail
        CRATES_IO_USER_AGENT="agentsight-release-ci (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}; run ${GITHUB_RUN_ID})"
        if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
          echo "::error::CARGO_REGISTRY_TOKEN is not set; cannot publish to crates.io."
          exit 1
        fi

        VERSION="${{ needs.release_prepare.outputs.agentsight_capture_version }}"
        cargo publish --manifest-path agentsight-capture/Cargo.toml
        for attempt in 1 2 3 4 5 6; do
          if curl --retry 3 --retry-delay 2 -A "$CRATES_IO_USER_AGENT" -fsS \
            "https://crates.io/api/v1/crates/agentsight-capture/${VERSION}" >/dev/null; then
            exit 0
          fi
          sleep $((attempt * 10))
        done
        echo "::error::agentsight-capture ${VERSION} was not visible on crates.io after publish."
        exit 1

    - name: Verify agentsight Cargo package
      run: |
        cd collector
        cargo package

    - name: Verify agentpprof Cargo package
      run: |
        CARGO_TARGET_DIR=/tmp/agentsight-agentpprof-package \
          cargo package --manifest-path agentpprof/Cargo.toml

    - name: Publish agentsight crate to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
          echo "::error::CARGO_REGISTRY_TOKEN is not set; cannot publish to crates.io."
          exit 1
        fi

        cd collector
        cargo publish

    - name: Smoke test cargo install from crates.io
      env:
        VERSION: ${{ needs.release_prepare.outputs.version }}
      run: |
        set -euo pipefail

        install_dir="$(mktemp -d)"
        for attempt in 1 2 3 4 5 6; do
          if cargo install agentsight \
            --version "$VERSION" \
            --locked \
            --root "$install_dir"; then
            break
          fi

          if [ "$attempt" -eq 6 ]; then
            echo "::error::cargo install agentsight ${VERSION} failed after ${attempt} attempts"
            exit 1
          fi

          sleep $((attempt * 10))
        done

        "$install_dir/bin/agentsight" --version
        "$install_dir/bin/agentsight" --help | tee /tmp/agentsight-cargo-install-help.txt

        for cmd in top monitor record report debug; do
          if ! grep -Eq "^[[:space:]]+$cmd[[:space:]]" /tmp/agentsight-cargo-install-help.txt; then
            echo "::error::cargo-installed agentsight is missing '$cmd' in --help"
            exit 1
          fi
        done

    - name: Publish agentpprof crate to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
          echo "::error::CARGO_REGISTRY_TOKEN is not set; cannot publish to crates.io."
          exit 1
        fi

        cargo publish --manifest-path agentpprof/Cargo.toml

    - name: Smoke test agentpprof cargo install from crates.io
      env:
        VERSION: ${{ needs.release_prepare.outputs.agentpprof_version }}
      run: |
        set -euo pipefail

        install_dir="$(mktemp -d)"
        for attempt in 1 2 3 4 5 6; do
          if cargo install agentpprof \
            --version "$VERSION" \
            --locked \
            --root "$install_dir"; then
            break
          fi

          if [ "$attempt" -eq 6 ]; then
            echo "::error::cargo install agentpprof ${VERSION} failed after ${attempt} attempts"
            exit 1
          fi

          sleep $((attempt * 10))
        done

        "$install_dir/bin/agentpprof" --version
        "$install_dir/bin/agentpprof" --help | tee /tmp/agentpprof-cargo-install-help.txt

        for flag in "--output" "--view" "--tagger" "--session-file"; do
          if ! grep -Fq -- "$flag" /tmp/agentpprof-cargo-install-help.txt; then
            echo "::error::cargo-installed agentpprof is missing '$flag' in --help"
            exit 1
          fi
        done

  release_binaries:
    name: Build Release Binaries (${{ matrix.arch }})
    needs: release_prepare
    runs-on: ${{ matrix.runner }}
    if: |
      !cancelled() &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          needs.release_prepare.result == 'success'
        )
      )
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"arch":"aarch64","docker_arch":"arm64","runner":"ubuntu-24.04-arm","legacy_assets":false}]}' || '{"include":[{"arch":"x86_64","docker_arch":"amd64","runner":"ubuntu-24.04","legacy_assets":true},{"arch":"aarch64","docker_arch":"arm64","runner":"ubuntu-24.04-arm","legacy_assets":false}]}') }}

    steps:
    - name: Checkout release snapshot
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.release_prepare.outputs.publish_sha || github.sha }}
        submodules: 'recursive'

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libelf1 libelf-dev zlib1g-dev libclang-dev \
          make git clang llvm pkg-config build-essential

    - name: Build release binaries
      run: |
        make build
        cargo build --release --manifest-path agentpprof/Cargo.toml

    - name: Smoke test release binaries
      run: |
        set -euo pipefail
        collector/target/release/agentsight --version
        collector/target/release/agentsight --help | grep -Eq '^[[:space:]]+record[[:space:]]'
        agentpprof/target/release/agentpprof --version
        agentpprof/target/release/agentpprof --help | grep -F -- '--session-file'

    - name: Prepare architecture-qualified assets
      run: |
        set -euo pipefail
        mkdir -p release-assets docker-assets
        install -m 0755 collector/target/release/agentsight \
          "release-assets/agentsight-${{ matrix.arch }}"
        install -m 0755 agentpprof/target/release/agentpprof \
          "release-assets/agentpprof-${{ matrix.arch }}"
        install -m 0755 collector/target/release/agentsight docker-assets/agentsight

        if [ "${{ matrix.legacy_assets }}" = "true" ]; then
          cp release-assets/agentsight-x86_64 release-assets/agentsight
          cp release-assets/agentpprof-x86_64 release-assets/agentpprof
        fi

    - name: Upload release assets
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: release-linux-${{ matrix.arch }}
        path: release-assets/
        if-no-files-found: error
        retention-days: 1

    - name: Upload Docker binary
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: docker-linux-${{ matrix.docker_arch }}
        path: docker-assets/agentsight
        if-no-files-found: error
        retention-days: 1

  release:
    name: Assemble GitHub Release
    needs: [release_prepare, release_binaries, publish_crates]
    runs-on: ubuntu-24.04

    steps:
    - name: Download release assets
      uses: actions/download-artifact@v4
      with:
        pattern: release-linux-*
        path: release-assets
        merge-multiple: true

    - name: Verify release asset architectures
      run: |
        set -euo pipefail
        file release-assets/agentsight-x86_64 | grep -F "x86-64"
        file release-assets/agentsight-aarch64 | grep -F "ARM aarch64"
        cmp release-assets/agentsight release-assets/agentsight-x86_64
        cmp release-assets/agentpprof release-assets/agentpprof-x86_64

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        prerelease: false
        tag_name: ${{ needs.release_prepare.outputs.tag }}
        target_commitish: ${{ needs.release_prepare.outputs.publish_sha }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Smoke test published x86_64 artifacts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.release_prepare.outputs.tag }}
      run: |
        set -euo pipefail
        smoke_dir="$(mktemp -d)"
        gh release download "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern agentsight \
          --pattern agentpprof \
          --dir "$smoke_dir"

        chmod +x "$smoke_dir/agentsight" "$smoke_dir/agentpprof"
        "$smoke_dir/agentsight" --version
        "$smoke_dir/agentsight" --help | tee "$smoke_dir/help.txt"
        grep -Eq '^[[:space:]]+record[[:space:]]' "$smoke_dir/help.txt"
        "$smoke_dir/agentpprof" --version
        "$smoke_dir/agentpprof" --help | grep -F -- '--session-file'

    - name: Dispatch and monitor npm package publish
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.release_prepare.outputs.tag }}
      run: |
        npm_run_url="$(gh workflow run npm-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG")"
        gh run watch "${npm_run_url##*/}" --repo "$GITHUB_REPOSITORY" --exit-status --compact
