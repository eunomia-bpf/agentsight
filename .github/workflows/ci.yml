name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  actions: write
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release run pushes its version snapshot back to master. Cancelling master
  # runs would terminate that same release after the snapshot is persisted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          target: wasm32-wasip2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libelf1 libelf-dev zlib1g-dev libclang-dev \
            make git clang llvm pkg-config build-essential

      - name: Build and test BPF programs
        run: |
          make -C bpf
          make -C bpf test

      - name: Test frontend shell and web extensions
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test:workers
          node frontend/scripts/prepare-sample.mjs
          npm --prefix frontend run build
          npm --prefix frontend run test:e2e

      - name: Test control plane
        run: |
          npm --prefix controller ci
          npm --prefix controller test
          npm --prefix controller run check
          ./controller/node_modules/.bin/wrangler deploy --dry-run --config wrangler.jsonc
          ./controller/node_modules/.bin/wrangler deploy --dry-run --config wrangler.preview.jsonc

      - name: Build visualization web extension
        run: |
          npm --prefix ext/vis/web ci
          npm --prefix ext/vis/web run build
          cmp ext/vis/web/dist/repository-nebula.iife.js ext/vis/vendor/vis/repository-nebula.iife.js

      - name: Check Rust capture and extensions
        run: |
          set -euo pipefail
          manifests=(
            agentsight-capture/Cargo.toml
            agentsight-protocol/Cargo.toml
            compat/agentsight-capture/Cargo.toml
            ext/analysis/Cargo.toml
            ext/runtime/Cargo.toml
            ext/session/Cargo.toml
            ext/vis/Cargo.toml
            ext/pprof/Cargo.toml
          )
          for manifest in "${manifests[@]}"; do
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            cargo test --manifest-path "$manifest" --verbose
          done
          cargo build --manifest-path ext/session/Cargo.toml --target wasm32-wasip2
          cargo run --manifest-path ext/runtime/Cargo.toml --example session_smoke -- \
            "$PWD/ext/session/target/wasm32-wasip2/debug/agent_session.wasm"

      - name: Build and test AgentSight CLI
        run: |
          cargo build --manifest-path collector/Cargo.toml --verbose
          cargo clippy --manifest-path collector/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path collector/Cargo.toml --verbose

      - name: Validate npm package
        run: |
          node script/npm/sync-version.mjs
          node script/npm/prepare-agentsight.mjs
          npm --prefix package/npm/agentsight test
          (cd package/npm/agentsight && npm pack --dry-run)

      - name: E2E latest agent CLI canary
        run: script/e2e/latest_agent_cli_canary.sh
        env:
          AGENTSIGHT_AGENT_CANARY_REQUIRE_EBPF: "1"

      - name: Run C tests with AddressSanitizer
        run: |
          make -C bpf clean
          make -C bpf ASAN=1 test

  release_prepare:
    name: Prepare Release Snapshot
    needs: test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')
    outputs:
      version: ${{ steps.version.outputs.version }}
      session_version: ${{ steps.version.outputs.session_version }}
      tag: ${{ steps.version.outputs.tag }}
      publish_sha: ${{ steps.snapshot.outputs.publish_sha }}
      should_publish: ${{ steps.snapshot.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libelf1 libelf-dev zlib1g-dev libclang-dev \
            make git clang llvm pkg-config build-essential

      - name: Select and apply release versions
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exists() {
            local status
            status="$(curl --retry 3 --retry-delay 2 -A "agentsight-release-ci (${GITHUB_REPOSITORY})" \
              -sS -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$1/$2")"
            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "crates.io returned HTTP ${status} for $1 $2" >&2; return 2 ;;
            esac
          }
          BASE="$(sed -n 's/^version = "\([^"]*\)"/\1/p' collector/Cargo.toml | head -1)"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          VERSION="$BASE"
          while true; do
            TAG="v${VERSION}"
            taken=false
            # The tag/release is the durable completion marker. A crate may
            # already exist after a partial publish, so crate availability must
            # not force a new family version instead of resuming that release.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && taken=true
            git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 && taken=true
            [[ "$taken" == false ]] && break
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          done

          SESSION_BASE="$(sed -n 's/^version = "\([^"]*\)"/\1/p' ext/session/Cargo.toml | head -1)"
          IFS=. read -r SMAJ SMIN SPATCH <<< "$SESSION_BASE"
          SESSION_VERSION="$SESSION_BASE"
          # An untagged base is a partial release snapshot: resume the matching
          # session version as well, and let the idempotent publisher skip any
          # packages that already reached crates.io.
          if [[ "$VERSION" != "$BASE" ]]; then
            while true; do
              if exists agent-session "$SESSION_VERSION"; then
                SPATCH=$((SPATCH + 1))
                SESSION_VERSION="${SMAJ}.${SMIN}.${SPATCH}"
                continue
              else
                status=$?
              fi
              [[ "$status" == 1 ]] || exit "$status"
              break
            done
          fi

          python3 script/release/set_versions.py "$VERSION" "$SESSION_VERSION"
          cargo generate-lockfile --manifest-path ext/vis/Cargo.toml
          cargo generate-lockfile --manifest-path ext/pprof/Cargo.toml
          cargo generate-lockfile --manifest-path collector/Cargo.toml

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "session_version=$SESSION_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate selected release versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SESSION_VERSION: ${{ steps.version.outputs.session_version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SESSION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TAG" == "v$VERSION" ]]

      - name: Build release snapshot
        run: |
          make build
          cargo build --release --manifest-path ext/pprof/Cargo.toml

      - name: Commit release snapshot
        id: snapshot
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF#refs/heads/}"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "publish_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add \
            ext/session/Cargo.toml \
            agentsight-protocol/Cargo.toml \
            agentsight-capture/Cargo.toml agentsight-capture/vendor \
            compat/agentsight-capture/Cargo.toml \
            ext/analysis/Cargo.toml ext/analysis/ext.toml \
            ext/runtime/Cargo.toml ext/runtime/ext.toml \
            ext/web/ext.toml \
            ext/vis/Cargo.toml ext/vis/Cargo.lock ext/vis/vendor \
            ext/pprof/Cargo.toml ext/pprof/Cargo.lock \
            collector/Cargo.toml collector/Cargo.lock collector/vendor
          if ! git diff --cached --quiet; then
            git commit -m "chore: release agentsight ${VERSION} [skip ci]"
            git push --force-with-lease="refs/heads/${BRANCH}:${GITHUB_SHA}" origin "HEAD:${BRANCH}"
          fi
          PUBLISH_SHA="$(git rev-parse HEAD)"
          echo "publish_sha=$PUBLISH_SHA" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  release_binaries:
    name: Build Release Binaries (${{ matrix.arch }})
    needs: release_prepare
    if: needs.release_prepare.outputs.should_publish == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker_arch: amd64
            runner: ubuntu-24.04
            legacy_assets: true
          - arch: aarch64
            docker_arch: arm64
            runner: ubuntu-24.04-arm
            legacy_assets: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release_prepare.outputs.publish_sha }}
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libelf1 libelf-dev zlib1g-dev libclang-dev \
            make git clang llvm pkg-config build-essential

      - name: Build and smoke release binaries
        run: |
          make build
          cargo build --release --manifest-path ext/pprof/Cargo.toml
          collector/target/release/agentsight --version
          collector/target/release/agentsight --help | grep -Eq '^[[:space:]]+record[[:space:]]'
          ext/pprof/target/release/agentpprof --version
          ext/pprof/target/release/agentpprof --help | grep -F -- '--session-file'

      - name: Prepare assets
        run: |
          mkdir -p release-assets docker-assets
          install -m 0755 collector/target/release/agentsight "release-assets/agentsight-${{ matrix.arch }}"
          install -m 0755 ext/pprof/target/release/agentpprof "release-assets/agentpprof-${{ matrix.arch }}"
          install -m 0755 collector/target/release/agentsight docker-assets/agentsight
          if [[ "${{ matrix.legacy_assets }}" == true ]]; then
            cp release-assets/agentsight-x86_64 release-assets/agentsight
            cp release-assets/agentpprof-x86_64 release-assets/agentpprof
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: docker-linux-${{ matrix.docker_arch }}
          path: docker-assets/agentsight
          if-no-files-found: error
          retention-days: 1

  publish_crates:
    name: Publish Cargo Packages
    needs: [release_prepare, release_binaries]
    if: needs.release_prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release_prepare.outputs.publish_sha }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libelf1 libelf-dev zlib1g-dev libclang-dev \
            make git clang llvm pkg-config build-essential

      - name: Publish dependency-ordered crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          bash script/release/publish_crates.sh \
            "${{ needs.release_prepare.outputs.version }}" \
            "${{ needs.release_prepare.outputs.session_version }}"

      - name: Smoke cargo installs
        env:
          VERSION: ${{ needs.release_prepare.outputs.version }}
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          for attempt in 1 2 3 4 5 6; do
            cargo install agentsight --version "$VERSION" --locked --root "$root" && break
            [[ "$attempt" -eq 6 ]] && exit 1
            sleep $((attempt * 10))
          done
          "$root/bin/agentsight" --version
          "$root/bin/agentsight" --help | grep -Eq '^[[:space:]]+record[[:space:]]'

          pprof_root="$(mktemp -d)"
          cargo install agentpprof --version "$VERSION" --locked --root "$pprof_root"
          "$pprof_root/bin/agentpprof" --help | grep -F -- '--session-file'

  release:
    name: Assemble GitHub Release
    needs: [release_prepare, release_binaries, publish_crates]
    if: needs.release_prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset architectures
        run: |
          file release-assets/agentsight-x86_64 | grep -F "x86-64"
          file release-assets/agentsight-aarch64 | grep -F "ARM aarch64"
          cmp release-assets/agentsight release-assets/agentsight-x86_64
          cmp release-assets/agentpprof release-assets/agentpprof-x86_64

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          prerelease: false
          tag_name: ${{ needs.release_prepare.outputs.tag }}
          target_commitish: ${{ needs.release_prepare.outputs.publish_sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke published x86_64 assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release_prepare.outputs.tag }}
        run: |
          dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern agentsight --pattern agentpprof --dir "$dir"
          chmod +x "$dir/agentsight" "$dir/agentpprof"
          "$dir/agentsight" --version
          "$dir/agentsight" --help | grep -Eq '^[[:space:]]+record[[:space:]]'
          "$dir/agentpprof" --help | grep -F -- '--session-file'

      - name: Dispatch and monitor npm package publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release_prepare.outputs.tag }}
        run: |
          run_url="$(gh workflow run npm-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG")"
          gh run watch "${run_url##*/}" --repo "$GITHUB_REPOSITORY" --exit-status --compact

  docker:
    name: Build and Push Docker Image
    needs: [release_prepare, release_binaries, publish_crates]
    if: needs.release_prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release_prepare.outputs.publish_sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: docker-linux-*
          path: docker-bin

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./
          file: script/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.release_prepare.outputs.publish_sha }}
          push: true
