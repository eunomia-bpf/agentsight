name: Windows native

on:
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: |
            agentsight-protocol -> target
            agentsight-capture -> target
            compat/agentsight-capture -> target
            ext/session -> target
            collector -> target

      - name: Test portable session parser
        run: cargo test --manifest-path ext/session/Cargo.toml

      - name: Test portable capture and native CLI
        run: |
          cargo test --manifest-path agentsight-protocol/Cargo.toml
          cargo test --manifest-path agentsight-capture/Cargo.toml
          cargo test --manifest-path compat/agentsight-capture/Cargo.toml
          cargo test --manifest-path collector/Cargo.toml

      - name: Lint Windows capture
        run: |
          cargo clippy --manifest-path agentsight-capture/Cargo.toml --all-targets -- -D warnings

      - name: Verify canonical cross-platform source layout
        shell: pwsh
        run: |
          $manifests = @(
            "agentsight-protocol/Cargo.toml",
            "ext/session/Cargo.toml",
            "ext/pprof/Cargo.toml",
            "ext/vis/Cargo.toml"
          )
          foreach ($manifest in $manifests) {
            if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
              throw "missing canonical manifest: $manifest"
            }
          }

      - name: Test frontend shell and web extensions
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test:workers
          npm --prefix frontend run build

      - name: Build and smoke test agentsight.exe
        shell: pwsh
        run: |
          cargo build --manifest-path collector/Cargo.toml
          pwsh -NoProfile -File script/ci/windows_smoke.ps1 `
            -BinaryPath collector/target/debug/agentsight.exe

      - name: Verify Windows release asset packaging
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "agentsight-release-staging"
          pwsh -NoProfile -File script/release/package_windows_assets.ps1 `
            -BinaryPath collector/target/debug/agentsight.exe `
            -OutputDir $staging
          pwsh -NoProfile -File script/release/verify_windows_asset.ps1 `
            -AssetPath (Join-Path $staging "agentsight-windows-x86_64.exe") `
            -ChecksumPath (Join-Path $staging "agentsight-windows-x86_64.exe.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: agentsight-windows-x86_64
          path: collector/target/debug/agentsight.exe
