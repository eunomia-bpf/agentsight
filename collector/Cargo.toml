[package]
name = "agentsight"
version = "1.0.21"
edition = "2024"
rust-version = "1.87"
description = "eBPF-based observability for AI agent sessions, prompts, process trees, files, network activity, and token usage."
license = "MIT"
repository = "https://github.com/eunomia-bpf/agentsight"
homepage = "https://github.com/eunomia-bpf/agentsight"
readme = "../README.md"
keywords = ["ebpf", "ai-agent", "observability", "llm", "linux"]
categories = ["command-line-utilities", "development-tools::debugging", "os::linux-apis"]
build = "build.rs"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "build.rs",
    "src/**",
    "tests/**",
    "vendor/frontend/dist/**",
]

[profile.release]
codegen-units = 1
strip = "symbols"

[dependencies]
agentsight-capture = { version = "1.0.21", path = "../agentsight-capture" }
agentsight-protocol = { version = "1.0.21", path = "../agentsight-protocol" }
agent-session = { version = "0.5.4", path = "../agent-session" }
agentvis = { version = "1.0.21", path = "../agentvis" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.41", features = ["derive"] }
futures = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.10"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
env_logger = "0.10"
dirs = "6"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29"
url = "2"

# Web server dependencies
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
rust-embed = { version = "8.7", features = ["debug-embed", "compression", "include-exclude"] }
mime_guess = "2.0"

[dev-dependencies]
agentsight-capture = { version = "1.0.21", path = "../agentsight-capture", features = ["test-support"] }
