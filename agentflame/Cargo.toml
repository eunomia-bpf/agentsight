[package]
name = "agentflame"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local AI agent session tagger and semantic flamegraph generator"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
hex = "0.4"
normalize-chat-sessions = { version = "0.3.2", default-features = false, features = ["format-claude", "format-codex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
ureq = { version = "2", features = ["json"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
