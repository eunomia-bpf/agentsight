[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflame"
version = "0.1.0"
description = "Local AI agent session tagger and semantic flamegraph generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AgentSight"}]
dependencies = []

[project.scripts]
agentflame = "agentflame.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentflame*"]
