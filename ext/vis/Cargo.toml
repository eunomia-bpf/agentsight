[package]
name = "agentvis"
version = "1.0.25"
edition = "2024"
rust-version = "1.87"
description = "Standalone repository-evolution visualizations for local AI-agent sessions."
license = "MIT"
repository = "https://github.com/eunomia-bpf/agentsight"
homepage = "https://github.com/eunomia-bpf/agentsight/tree/master/ext/vis"
readme = "README.md"
keywords = ["ai-agent", "visualization", "repository", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "src/**",
    "vendor/vis/**",
    "web/package.json",
    "web/package-lock.json",
    "web/repository-nebula.js",
    "web/repository-nebula.test.mjs",
    "web/runtime.js",
    "web/vite.config.js",
    "!web/node_modules/**",
    "!web/dist/**",
]

[dependencies]
agent-session = { version = "0.5.8", path = "../session" }
base64 = "0.22"
clap = { version = "4.5.41", features = ["derive"] }
dirs = "6"
headless_chrome = "1.0.22"
hex = "0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
tempfile = "3.10"
