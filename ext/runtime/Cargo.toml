[package]
name = "agentsight-ext-runtime"
version = "1.0.25"
edition = "2024"
rust-version = "1.87"
description = "Bounded in-process WebAssembly Component runtime for AgentSight extensions."
license = "MIT"
repository = "https://github.com/eunomia-bpf/agentsight"

[dependencies]
wasmtime = { version = "37.0.2", default-features = false, features = ["component-model", "cranelift", "runtime"] }
wasmtime-wasi = { version = "37.0.2", default-features = false, features = ["p2"] }
